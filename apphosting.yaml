# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

  # Environment variables and secrets.
  # env:
  # Configure environment variables.
  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  # - variable: MESSAGE
  #   value: Hello world!
  #   availability:
  #     - BUILD
  #     - RUNTIME

  # Grant access to secrets in Cloud Secret Manager.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
  # - variable: MY_SECRET
  #   secret: mySecretRef
env:
  - variable: EMAIL_HOST
    secret: email-host
  - variable: EMAIL_USER
    secret: email-user
  - variable: EMAIL_PASS
    secret: email-pass
  - variable: BUG_REPORT_TO
    secret: bug-report-to
  - variable: CLIENT_FIREBASE_API_KEY
    secret: client-firebase-api-key
  - variable: CLIENT_FIREBASE_AUTH_DOMAIN
    secret: client-firebase-auth-domain
  - variable: CLIENT_FIREBASE_PROJECT_ID
    secret: client-firebase-project-id
  - variable: CLIENT_FIREBASE_STORAGE_BUCKET
    secret: client-firebase-storage-bucket
  - variable: CLIENT_FIREBASE_MESSAGING_SENDER_ID
    secret: client-firebase-messaging-sender-id
  - variable: CLIENT_FIREBASE_APP_ID
    secret: client-firebase-app-id
  - variable: CLIENT_FIREBASE_MEASUREMENT_ID
    secret: client-firebase-measurement-id
  - variable: HMAC_SECRET
    secret: hmac-secret
